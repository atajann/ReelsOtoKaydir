name: APK Derle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # İmza anahtarı GitHub önbelleğinde saklanır (repoda değil):
      # her derleme aynı anahtarla imzalanır, güncellemeler eskisinin üzerine kurulur
      - name: İmza anahtarını önbellekten al
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: reelscout-signing-key-v1

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: APK derle
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ReelScout.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ReelScout-apk
          path: ReelScout.apk

      - name: APK'yı Release olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ReelScout (derleme ${{ github.run_number }})
          files: ReelScout.apk

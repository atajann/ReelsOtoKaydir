name: APK Derle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK, ubuntu-latest sunucusunda hazır kurulu gelir (ANDROID_HOME)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: APK derle
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ReelsOtoKaydir.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ReelsOtoKaydir-apk
          path: ReelsOtoKaydir.apk

      - name: APK'yı Release olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Reels Oto Kaydır (derleme ${{ github.run_number }})
          files: ReelsOtoKaydir.apk
